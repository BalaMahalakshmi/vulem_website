<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Forever Love</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    overflow-x: hidden;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    color: white;
}

.page {
    display: none;
    min-height: 100vh;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    animation: fadeIn 1.5s ease-in-out;
}

.active { display: flex; }

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

h1 {
    font-size: 3rem;
    text-shadow: 0 0 25px rgba(255,255,255,0.9);
}

button {
    padding: 12px 30px;
    margin: 15px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
}

.yes { background: #ff2e63; color: white; box-shadow: 0 0 20px #ff2e63; }
.no { background: #333; color: white; position: absolute; }
.next-btn { background: white; color: #ff2e63; }

/* Floating Hearts */
.heart {
    position: fixed;
    animation: float 6s linear infinite;
}

@keyframes float {
    0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
    100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
}

/* Gallery */
.gallery { display: flex; gap: 40px; }
.gallery img {
    width: 250px;
    height: 250px;
    object-fit: cover;
    border-radius: 20px;
    box-shadow: 0 0 25px rgba(255,255,255,0.8);
    transition: 0.5s;
}
.gallery img:hover { transform: scale(1.1); }

.quote-box { margin-top: 30px; font-size: 1.6rem; max-width: 700px; text-align: center; }

/* Split Page */
.split-container { display: flex; width: 100%; height: 100vh; }
.left, .right { width: 50%; display: flex; justify-content: center; align-items: center; padding: 40px; }
.left img { width: 70%; border-radius: 25px; box-shadow: 0 0 40px white; }
.right { font-size: 1.8rem; text-align: left; }

/* Music Page Romantic Background */
.music-bg {
    background: radial-gradient(circle at top, #ff9a9e, #fad0c4, #ff758c);
    background-size: 400% 400%;
    animation: gradientMove 10s ease infinite;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.play-btn {
    font-size: 22px;
    background: #fff;
    color: #ff2e63;
    box-shadow: 0 0 20px white;
}

</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page active" id="page1">
    <h1>Will You Marry Me? 💍❤️</h1>
    <div>
        <button class="yes" onclick="goToPage2()">Yes 💖</button>
        <button class="no" id="noBtn">No 💔</button>
    </div>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
    <h1>Our Beautiful Memories 📸💖</h1>
    <div class="gallery">
        <img src="C:\Users\balam\Downloads\pic1.jpg" onclick="showQuote(0)">
        <img src="C:\Users\balam\Downloads\pic2.jpg" onclick="showQuote(1)">
        <img src="C:\Users\balam\Downloads\pic3.jpg" onclick="showQuote(2)">
    </div>
    <div class="quote-box" id="quoteBox"></div>
    <button class="next-btn" onclick="goToPage3()">Next ❤️</button>
</div>

<!-- PAGE 3 -->
<div class="page" id="page3">
    <div class="split-container">
        <div class="left">
            <img src="C:\Users\balam\Downloads\mahasabi_page-0001.jpg" alt="Our Special Moment">
        </div>
        <div class="right">
            <div>
                "You are my today, my tomorrow, and my forever. 💕<br><br>
                Loving you is the best decision of my life.<br><br>
                I promise to stand by you in every smile and every tear. 💍"
                <br><br>
                <button class="next-btn" onclick="goToPage4()">for you! My Comrade💖🎵</button>
            </div>
        </div>
    </div>
</div>

<!-- PAGE 4 (Music Page) -->
<div class="page music-bg" id="page4">
    <h1>Our Song 🎶❤️</h1>
    <button class="play-btn" onclick="playSong()">▶ Hey!.. Comrade hear the Song</button>
    <audio id="romanticSong">
        <source src="C:\Users\balam\Downloads\dude.ogg" type="audio/mpeg">
    </audio>
</div>

<script>
const quotes = [
    "From the first day I saw you, my heart chose you ❤️",
    "Every second with you is my favorite memory 🌹",
    "Forever isn't enough when I'm with you 💍"
];

function goToPage2() {
    document.getElementById('page1').classList.remove('active');
    document.getElementById('page2').classList.add('active');
}

function goToPage3() {
    document.getElementById('page2').classList.remove('active');
    document.getElementById('page3').classList.add('active');
}

function goToPage4() {
    document.getElementById('page3').classList.remove('active');
    document.getElementById('page4').classList.add('active');
}

function showQuote(index) {
    document.getElementById('quoteBox').innerText = quotes[index];
}

function playSong() {
    document.getElementById('romanticSong').play();
}

const noBtn = document.getElementById("noBtn");
noBtn.addEventListener("mouseover", function() {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 20 + 20 + "px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
}
setInterval(createHeart, 400);
</script>

</body>
</html>
